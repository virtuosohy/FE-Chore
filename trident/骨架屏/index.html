<!DOCTYPE html>
<html lang="zh">
<body>
<div class="grid">
    <div class="card">
        <div class="header">
            <img class="skeleton-img" src="https://source.unsplash.com/100x100/?animal" />
            <div data-title class="title">
                <div class="skeleton-text"></div>
                <div class="skeleton-text"></div>
            </div>
        </div>
        <div data-body>
            <div class="skeleton-text"></div>

        </div>
    </div>
</div>
</body>

<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        padding: 1rem;
        gap: 1rem;
    }
    .title {
        font-weight: bold;
        font-size: 1.25rem;
        width: 100%;
        height: 100%;
        word-wrap: none;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        flex-grow: 1;
    }

    .header {
        display: flex;
        margin-bottom: 1rem;
        align-items: center;
    }
    .card {
        background-color: white;
        border-radius: 0.5rem;
        box-shadow: rgba(0, 0, 0, 0.1) 0 4px 6px -1px, rgba(0, 0, 0, 0.06) 0px 2px 4px -1px;
        padding: 1rem;
    }
    img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        flex-shrink: 0;
        object-fit: cover;
        margin-right: 1rem;
    }
    .skeleton-img {
        opacity: 0.7;
        animation: skeleton-img-loading 1s linear infinite alternate;
    }
    @keyframes skeleton-img-loading {
        0% {
            background-color: hsl(200, 20%, 70%);
        }
        100% {
            background-color: hsl(200, 20%, 95%);
        }
    }
    .skeleton-text {
        width: 100%;
        height: 0.5rem;
        opacity: 0.7;
        background-image: linear-gradient(
                90deg,
                hsl(200, 20%, 70%) 0%,
                hsl(200, 20%, 90%) 50%,
                hsl(200, 20%, 70%) 100%
        );
        margin-bottom: 0.25rem;
        border-radius: 0.125rem;
        background-size: 400% 100%;
        background-position: 100% 50%;
        animation: skeleton-text-loading 1s ease infinite;
    }

    @keyframes skeleton-text-loading {
        0% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0 50%;
        }
    }


</style>
</html>
